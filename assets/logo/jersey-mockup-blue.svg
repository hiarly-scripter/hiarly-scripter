<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 620 780" width="620" height="780">
  <defs>

    <!-- ══ Jersey body gradient — royal blue with subtle depth ══ -->
    <linearGradient id="jBody" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#112D96"/>
      <stop offset="25%"  stop-color="#1940B8"/>
      <stop offset="50%"  stop-color="#1C44BE"/>
      <stop offset="75%"  stop-color="#1940B8"/>
      <stop offset="100%" stop-color="#112D96"/>
    </linearGradient>

    <!-- ══ Sleeve gradient (slightly varied) ══ -->
    <linearGradient id="jBodyFull" x1="100" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0F2888"/>
      <stop offset="20%"  stop-color="#1A3FB5"/>
      <stop offset="50%"  stop-color="#1C44BE"/>
      <stop offset="80%"  stop-color="#1A3FB5"/>
      <stop offset="100%" stop-color="#0F2888"/>
    </linearGradient>

    <!-- ══ Shadow under jersey ══ -->
    <radialGradient id="jShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="rgba(0,0,0,0.22)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>

    <!-- ══ HFS logo: all gradients inlined ══ -->
    <linearGradient id="hGold" x1="400" y1="158" x2="400" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FFE900"/>
      <stop offset="55%"  stop-color="#FFB600"/>
      <stop offset="100%" stop-color="#C97F00"/>
    </linearGradient>
    <linearGradient id="hGreen" x1="200" y1="158" x2="600" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#14C452"/>
      <stop offset="40%"  stop-color="#009B38"/>
      <stop offset="100%" stop-color="#005E21"/>
    </linearGradient>
    <pattern id="hStripe" width="7" height="7"
             patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="transparent"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#000" stroke-width="2.2"/>
    </pattern>

    <!-- ══ Clip for HFS shape (in original SVG coordinate space) ══ -->
    <clipPath id="hClip">
      <text x="400" y="410" text-anchor="middle"
            font-family="'Arial Black', Gadget, sans-serif"
            font-size="345" font-weight="900" letter-spacing="-12">HFS</text>
    </clipPath>

  </defs>

  <!-- ══════════════════════════════
       JERSEY SILHOUETTE — BACK VIEW
  ══════════════════════════════ -->

  <!-- Body + sleeves as one unified path -->
  <path d="
    M 250,80
    C 255,105 275,118 310,120
    C 345,118 365,105 370,80
    L 425,88
    C 458,90 530,122 558,155
    L 568,248
    L 530,258
    L 438,218
    L 438,668
    Q 438,685 310,688
    Q 182,685 182,668
    L 182,218
    L 90,258
    L 52,248
    L 62,155
    C 90,122 162,90 195,88
    Z
  " fill="url(#jBodyFull)"/>

  <!-- Sleeve cuffs (slightly darker band) -->
  <!-- Left cuff -->
  <path d="M 52,248 L 90,258 L 86,282 L 48,270 Z" fill="#0D2480"/>
  <!-- Right cuff -->
  <path d="M 568,248 L 530,258 L 534,282 L 572,270 Z" fill="#0D2480"/>

  <!-- Back collar (shallow crew-neck arc, back neckline) -->
  <path d="
    M 250,80
    C 265,88 285,95 310,97
    C 335,95 355,88 370,80
    C 355,72 335,68 310,67
    C 285,68 265,72 250,80
    Z
  " fill="#0D2480"/>

  <!-- Collar highlight thread -->
  <path d="M 255,82 C 275,92 295,97 310,98 C 325,97 345,92 365,82"
        fill="none" stroke="#3055CC" stroke-width="1.2" opacity="0.5"/>

  <!-- Center back seam (subtle) -->
  <line x1="310" y1="100" x2="310" y2="680"
        stroke="#0D2480" stroke-width="1" opacity="0.35"/>

  <!-- ══════════════════════════════
       STARS ARC around collar
  ══════════════════════════════ -->
  <!-- 11 stars curved along shoulders — like reference image -->
  <g fill="#FFE100" opacity="0.95">
    <!-- Left arc -->
    <polygon points="192,77 194,83 200,83 195,87 197,93 192,89 187,93 189,87 184,83 190,83"/>
    <polygon points="207,68 209,74 215,74 210,78 212,84 207,80 202,84 204,78 199,74 205,74"/>
    <polygon points="224,61 226,67 232,67 227,71 229,77 224,73 219,77 221,71 216,67 222,67"/>
    <polygon points="243,56 245,62 251,62 246,66 248,72 243,68 238,72 240,66 235,62 241,62"/>
    <polygon points="264,52 266,58 272,58 267,62 269,68 264,64 259,68 261,62 256,58 262,58"/>
    <!-- Center star (slightly larger) -->
    <polygon points="310,49 313,58 323,58 315,64 318,73 310,67 302,73 305,64 297,58 307,58"/>
    <!-- Right arc -->
    <polygon points="356,52 358,58 364,58 359,62 361,68 356,64 351,68 353,62 348,58 354,58"/>
    <polygon points="377,56 379,62 385,62 380,66 382,72 377,68 372,72 374,66 369,62 375,62"/>
    <polygon points="396,61 398,67 404,67 399,71 401,77 396,73 391,77 393,71 388,67 394,67"/>
    <polygon points="413,68 415,74 421,74 416,78 418,84 413,80 408,84 410,78 405,74 411,74"/>
    <polygon points="428,77 430,83 436,83 431,87 433,93 428,89 423,93 425,87 420,83 426,83"/>
  </g>

  <!-- ══════════════════════════════
       BRAZILIAN FLAG PATCHES — sleeves
  ══════════════════════════════ -->
  <!-- Left sleeve patch -->
  <g transform="translate(66, 172)">
    <rect x="0" y="0" width="46" height="30" rx="3" fill="#009B38"/>
    <polygon points="23,3 41,15 23,27 5,15" fill="#FFE900"/>
    <circle cx="23" cy="15" r="7" fill="#1A3FAA"/>
    <!-- White line through globe -->
    <line x1="12" y1="15" x2="34" y2="15" stroke="white" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Right sleeve patch -->
  <g transform="translate(508, 172)">
    <rect x="0" y="0" width="46" height="30" rx="3" fill="#009B38"/>
    <polygon points="23,3 41,15 23,27 5,15" fill="#FFE900"/>
    <circle cx="23" cy="15" r="7" fill="#1A3FAA"/>
    <line x1="12" y1="15" x2="34" y2="15" stroke="white" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- ══════════════════════════════
       HFS LOGO — INLINE (jersey back)
       Scaled to fill back body width.
       Original SVG: 800×460.
       Jersey back body: x 182–438 (256px).
       Scale ≈ 0.34  →  272px wide, 156px tall.
       Center-X: 310  →  translate-X = 310 − 400×0.34 = 310−136 = 174
       Center-Y: 410  →  translate-Y = 410 − 460×0.34/2 = 410−78 = 332
  ══════════════════════════════ -->
  <g transform="translate(174, 332) scale(0.34)">

    <!-- L1: outer black -->
    <text x="400" y="410" text-anchor="middle"
          font-family="'Arial Black', Gadget, sans-serif"
          font-size="345" font-weight="900" letter-spacing="-12"
          stroke="#000" stroke-width="48" stroke-linejoin="round" fill="#000"
          style="paint-order:stroke fill"/>

    <!-- L2: gold band -->
    <text x="400" y="410" text-anchor="middle"
          font-family="'Arial Black', Gadget, sans-serif"
          font-size="345" font-weight="900" letter-spacing="-12"
          stroke="url(#hGold)" stroke-width="30" stroke-linejoin="round" fill="url(#hGold)"
          style="paint-order:stroke fill"/>

    <!-- L3: inner dark border -->
    <text x="400" y="410" text-anchor="middle"
          font-family="'Arial Black', Gadget, sans-serif"
          font-size="345" font-weight="900" letter-spacing="-12"
          stroke="#0C0C00" stroke-width="14" stroke-linejoin="round" fill="#0C0C00"
          style="paint-order:stroke fill"/>

    <!-- L4: green fill -->
    <text x="400" y="410" text-anchor="middle"
          font-family="'Arial Black', Gadget, sans-serif"
          font-size="345" font-weight="900" letter-spacing="-12"
          fill="url(#hGreen)"/>

    <!-- Distress stripes -->
    <rect x="0" y="0" width="800" height="460"
          fill="url(#hStripe)" opacity="0.11" clip-path="url(#hClip)"/>

    <!-- Brazilian diamond + circuit overlay -->
    <g clip-path="url(#hClip)">
      <polygon points="400,128 632,282 400,436 168,282"
               fill="none" stroke="#FFE900" stroke-width="3.8" opacity="0.60"/>
      <polygon points="400,165 594,282 400,399 206,282"
               fill="none" stroke="#FFE900" stroke-width="1.8" opacity="0.30"/>
      <line x1="168" y1="282" x2="632" y2="282" stroke="#FFE900" stroke-width="1" opacity="0.18"/>
      <line x1="400" y1="128" x2="400" y2="436" stroke="#FFE900" stroke-width="1" opacity="0.18"/>
      <circle cx="400" cy="282" r="26" fill="none" stroke="#FFE900" stroke-width="1.5" opacity="0.40"/>
      <polygon
        points="400,258 406.1,276.1 425.3,276.1 410.6,287.3 416.7,305.4
                400,294.2 383.3,305.4 389.4,287.3 374.7,276.1 393.9,276.1"
        fill="#FFE900" opacity="0.82"/>
      <g stroke="#FFE900" stroke-width="2" fill="none" opacity="0.55">
        <polyline points="400,128 378,106 352,106"/>
        <polyline points="400,128 422,106 448,106"/>
        <polyline points="632,282 655,258 655,242"/>
        <polyline points="632,282 655,306 655,322"/>
        <polyline points="400,436 378,458 352,458"/>
        <polyline points="400,436 422,458 448,458"/>
        <polyline points="168,282 145,258 145,242"/>
        <polyline points="168,282 145,306 145,322"/>
      </g>
      <g fill="#FFE900" opacity="0.72">
        <circle cx="352" cy="106" r="4"/><circle cx="448" cy="106" r="4"/>
        <circle cx="655" cy="242" r="4"/><circle cx="655" cy="322" r="4"/>
        <circle cx="352" cy="458" r="4"/><circle cx="448" cy="458" r="4"/>
        <circle cx="145" cy="242" r="4"/><circle cx="145" cy="322" r="4"/>
      </g>
      <g fill="#FFE900" opacity="0.68">
        <circle cx="400" cy="128" r="5.5"/><circle cx="632" cy="282" r="5.5"/>
        <circle cx="400" cy="436" r="5.5"/><circle cx="168" cy="282" r="5.5"/>
      </g>
    </g>
    <!-- end inner design -->

  </g>
  <!-- end HFS group -->

</svg>
